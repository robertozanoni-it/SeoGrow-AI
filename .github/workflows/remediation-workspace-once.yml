name: Apply isolated remediation patch
on:
  push:
    branches: [fix/remediation-complete-resolution-paths]
    paths: [.github/remediation-patch-ready.txt]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/remediation-complete-resolution-paths'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply checked source integration
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 32ba50b075be3415ca955252616d5cf84fdd572f HEAD
          python .github/apply-remediation.py
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/qa-form-matrix.mjs')
          s=p.read_text()
          anchor='  await runFieldBoundaries('
          assert s.count(anchor)==1
          s="import { runResolutionPaths } from './qa-resolution-paths.mjs';\n"+s
          s=s.replace(anchor,'  await runResolutionPaths({evaluate,waitFor,record,button,set,read,revisit,mock,resetRequests,screenshot,command});\n'+anchor)
          p.write_text(s)
          p=Path('scripts/qa-matrix.mjs')
          s=p.read_text()
          anchor='export const qaMatrix = ['
          assert s.count(anchor)==1
          s=s.replace(anchor,anchor+'\n  ["REMEDIATION-REVIEW-AND-ABSENT-LINK", "Reviewed proposals and native absent-link state", "P0", "E2E Browser", "Synthetic upstream and actual React", "Reject, edit metadata/body, prepare; verify pending card and absent link", "No writes, full widget, resolved1 blocked0, desktop/mobile", "full"],')
          p.write_text(s)
          PY
          rm .github/apply-remediation.py .github/remediation-patch-ready.txt .github/workflows/remediation-workspace-once.yml
      - run: npm ci --ignore-scripts
      - run: npm run lint && npm test && npm run build
      - name: Commit source and remove this one-shot bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src server scripts
          git add -u -- .github
          git diff --cached --check
          git commit -m 'Repair content generation, reviewed proposals and native resolution state'
          git push origin HEAD:fix/remediation-complete-resolution-paths
          git archive --format=tar HEAD | gzip > /tmp/seogrow-resolution-source.tar.gz
      - uses: actions/upload-artifact@v6
        with:
          name: seogrow-resolution-source
          path: /tmp/seogrow-resolution-source.tar.gz
          retention-days: 1
          if-no-files-found: error
