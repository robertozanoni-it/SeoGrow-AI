name: Apply exact evidence safety fixes
on:
  push:
    branches: [ux/simple-numbered-wizard]
    paths: [.github/workflows/qa-evidence-cycle.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Apply tested source only with exact baseline and tree guards
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = be4c5e18df030e3cf8e916e4912c917802797b17
          python3 - <<'PY'
          import hashlib, lzma, os, pathlib, subprocess
          patch = lzma.decompress(pathlib.Path('.maintenance/evidence-cycle.patch.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest() == '5b29701a7f846fd0598292a10e12b2d5bb365fc644109596f11709a990ed2f44'
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'evidence-cycle.patch'
          path.write_bytes(patch)
          subprocess.run(['git','apply','--check','--index',str(path)],check=True)
          subprocess.run(['git','apply','--index',str(path)],check=True)
          paths = subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert len(paths) == 19 and all(p.startswith(('src/','scripts/')) for p in paths)
          subprocess.run(['git','rm','--','.maintenance/evidence-cycle.patch.xz','.github/workflows/qa-evidence-cycle.yml'],check=True)
          tree = subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree == '1b5b543df2369598e689054adb71f65f548211bb', 'Source differs from the locally tested tree'
          print('Exact tested source:',tree)
          PY
          git config user.name 'SeoGrow QA maintenance'
          git config user.email 'maintenance@users.noreply.github.com'
          git commit -m 'fix: bind correction actions to current issue and require observed verification evidence'
          git push origin HEAD:refs/heads/ux/simple-numbered-wizard
