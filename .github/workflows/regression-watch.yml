name: Regression Watch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-watch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  critical-journeys:
    name: Critical journey regression watch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout verified main
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci --ignore-scripts

      - name: Verify integrated main architecture
        run: node scripts/global-quality-audit.mjs

      - name: Record integrated main architecture evidence
        run: |
          mkdir -p .qa-runtime/regression-watch
          printf '{"sha":"%s","architecture":"pass"}\n' "$GITHUB_SHA" > .qa-runtime/regression-watch/summary.json

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: regression-watch-${{ github.sha }}
          path: .qa-runtime/regression-watch/
          if-no-files-found: error
          retention-days: 14
