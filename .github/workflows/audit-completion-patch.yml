name: Audit Completion Patch

on:
  push:
    branches:
      - audit/complete-seo-audit

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[audit-completion-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: audit/complete-seo-audit
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply audit completion patch
        run: node scripts/apply-audit-completion-patch.mjs
      - name: Commit patched runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.js src/AuditWorkspace.jsx
          git diff --cached --check
          git commit -m "Complete Audit SEO runtime [audit-completion-applied]"
          git push origin HEAD:audit/complete-seo-audit
