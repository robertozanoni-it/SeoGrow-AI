name: Integrate durable correction receipt
on:
  push:
    branches: [fix/remediation-complete-resolution-paths]
    paths: [.github/controlled-navigation.patch.gz.b64]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/remediation-complete-resolution-paths'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply exact reviewed receipt delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 7689dbdfce35b954ec79e5ee1bafc4677f01b46c
          base64 --decode .github/controlled-navigation.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/navigation.patch"
          echo "d1f1dbc5a088c94f2581c712bde79e3170c51f4e9825dd74667f68b8fedd77cb  $RUNNER_TEMP/navigation.patch" | sha256sum --check
          git apply --check --whitespace=error "$RUNNER_TEMP/navigation.patch"
          git apply --whitespace=error "$RUNNER_TEMP/navigation.patch"
          rm .github/controlled-navigation.patch.gz.b64 .github/workflows/apply-controlled-navigation-once.yml
          git add -- src scripts
          git add -u -- .github
          git diff --cached --check
          test "$(git write-tree)" = 59e9f08b299fad2d9ce813018519959a26a6c4ad
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Verify durable receipts after writer closure and show the correct next action'
          git push origin HEAD:fix/remediation-complete-resolution-paths
