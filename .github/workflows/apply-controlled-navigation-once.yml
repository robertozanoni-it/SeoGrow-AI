name: Integrate verified controlled navigation
on:
  push:
    branches: [fix/remediation-complete-resolution-paths]
    paths: [.github/controlled-navigation.patch.gz.b64]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/remediation-complete-resolution-paths'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Apply checksum-pinned navigation patch on its exact baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 3fe3dfc34fff3acda6d1dd3f782798f799c0b6f3
          base64 --decode .github/controlled-navigation.patch.gz.b64 | gzip -d > "$RUNNER_TEMP/navigation.patch"
          echo "85d30810cdd676ee75730bc02227f99cbdf61cf6aeea62f30d505ad42c63594e  $RUNNER_TEMP/navigation.patch" | sha256sum --check
          git apply --check --whitespace=error "$RUNNER_TEMP/navigation.patch"
          git apply --whitespace=error "$RUNNER_TEMP/navigation.patch"
          rm .github/controlled-navigation.patch.gz.b64 .github/workflows/apply-controlled-navigation-once.yml
          git add -- src scripts
          git add -u -- .github
          git diff --cached --check
          test "$(git write-tree)" = ba9a2cb768044010584d1b397680b1686359822e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Open controlled link previews visibly and scope both cleanup choices to the exact target'
          git push origin HEAD:fix/remediation-complete-resolution-paths
