name: Stage Connector 1.3.10 Package

on:
  push:
    branches:
      - deploy/seogrow-connector-1.3.10-package
    paths:
      - .github/workflows/stage-connector-1.3.10.yml

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: deploy/seogrow-connector-1.3.10-package
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build Connector package
        run: node scripts/package-connector.mjs
      - name: Commit staging package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-assets
          cp artifacts/seogrow-connector-1.3.10.zip deploy-assets/seogrow-connector-1.3.10.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy-assets/seogrow-connector-1.3.10.zip
          git commit -m "Stage Connector 1.3.10 ZIP for authorized staging"
          git push origin HEAD:deploy/seogrow-connector-1.3.10-package
